<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mise</title>
<meta name="theme-color" content="#c2552d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23c2552d'/><path d='M20 58h60a30 30 0 0 1-60 0z' fill='%23fbf4e8'/><path d='M38 50c-6-8 6-12 0-22M50 50c-6-8 6-12 0-22M62 50c-6-8 6-12 0-22' stroke='%23fbf4e8' stroke-width='5' fill='none' stroke-linecap='round'/></svg>">
<style>
:root {
  --bg:#fbf8f3; --panel:#ffffff; --ink:#1f1b16; --muted:#6f665b; --faint:#a59a8c; --line:#ebe3d7;
  --accent:#c2552d; --accent-ink:#fff; --accent-soft:rgba(194,85,45,.1); --danger:#c0392b; --ok:#2e7d4f;
  --radius:14px; --shadow:0 1px 2px rgba(40,30,20,.06), 0 4px 16px rgba(40,30,20,.06);
  --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#151311; --panel:#1e1b18; --ink:#f2ece4; --muted:#a59a8c; --faint:#776d61; --line:#2e2a25;
          --accent:#e0784a; --accent-soft:rgba(224,120,74,.14); --shadow:none; }
}
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
button, input, select, textarea { font:inherit; color:inherit; }
h1,h2,h3 { font-family:var(--serif); letter-spacing:-.01em; margin:0; }
h1 { font-size:2rem; line-height:1.15; }
h2 { font-size:1.3rem; margin:28px 0 12px; }
.muted { color:var(--muted); } .faint { color:var(--faint); } .small { font-size:.85rem; }
.hidden { display:none !important; }

/* layout */
.shell { display:flex; min-height:100vh; }
nav.side { width:220px; flex:none; padding:22px 14px; border-right:1px solid var(--line); position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px; }
nav.side .brand { font:700 1.6rem var(--serif); padding:0 10px 18px; display:flex; align-items:center; gap:10px; }
nav.side .brand svg { width:30px; height:30px; }
nav.side a { padding:9px 12px; border-radius:10px; display:flex; gap:10px; align-items:center; color:var(--muted); font-weight:500; }
nav.side a:hover { background:var(--accent-soft); color:var(--ink); }
nav.side a.on { background:var(--accent-soft); color:var(--accent); }
nav.side .spacer { flex:1; }
nav.side .who { padding:10px 12px; font-size:.85rem; color:var(--faint); }
nav.tabs { display:none; }
main { flex:1; min-width:0; padding:28px clamp(16px, 4vw, 48px) 120px; max-width:1280px; }
@media (max-width: 860px) {
  nav.side { display:none; }
  nav.tabs { display:flex; position:fixed; bottom:0; left:0; right:0; z-index:20; background:var(--panel); border-top:1px solid var(--line);
             padding:6px 4px calc(6px + env(safe-area-inset-bottom)); justify-content:space-around; }
  nav.tabs a { display:flex; flex-direction:column; align-items:center; font-size:.7rem; color:var(--muted); padding:4px 10px; gap:2px; }
  nav.tabs a.on { color:var(--accent); }
  main { padding-top:18px; }
}
.icon { width:20px; height:20px; flex:none; }

/* controls */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--panel); padding:9px 14px;
       border-radius:10px; cursor:pointer; font-weight:500; white-space:nowrap; }
.btn:hover { border-color:var(--faint); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn.primary:hover { filter:brightness(1.05); }
.btn.danger { color:var(--danger); }
.btn.ghost { background:transparent; border-color:transparent; }
.btn.ghost:hover { background:var(--accent-soft); }
.btn.sm { padding:6px 10px; font-size:.88rem; }
.btn[disabled] { opacity:.5; cursor:default; }
.iconbtn { border:0; background:transparent; cursor:pointer; padding:8px; border-radius:10px; display:inline-flex; color:var(--muted); }
.iconbtn:hover { background:var(--accent-soft); color:var(--ink); }
input[type=text], input[type=search], input[type=url], input[type=password], input[type=number], input[type=email], select, textarea {
  width:100%; border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:10px 12px; outline:none; }
input:focus, select:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
textarea { resize:vertical; min-height:120px; }
label.field { display:block; margin:0 0 14px; }
label.field > span { display:block; font-size:.85rem; color:var(--muted); margin-bottom:5px; font-weight:500; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.row.end { justify-content:flex-end; }
.grow { flex:1; }
.check { display:flex; gap:10px; align-items:center; cursor:pointer; }
.check input { width:18px; height:18px; accent-color:var(--accent); }
.seg { display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:3px; gap:2px; }
.seg button { border:0; background:transparent; padding:6px 12px; border-radius:8px; cursor:pointer; color:var(--muted); font-weight:500; }
.seg button.on { background:var(--accent-soft); color:var(--accent); }
.card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); }
.pill { display:inline-block; padding:3px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:.8rem; font-weight:500; }
.spinner { width:22px; height:22px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.empty { text-align:center; padding:60px 20px; color:var(--muted); }
.empty h3 { font-size:1.3rem; color:var(--ink); margin-bottom:8px; }
.error { color:var(--danger); }

/* page header */
.pagehead { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
.pagehead h1 { flex:1; min-width:180px; }

/* recipe grid */
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:22px 18px; }
.rcard { display:flex; flex-direction:column; gap:6px; cursor:pointer; }
.thumb { aspect-ratio:4/3; border-radius:12px; overflow:hidden; background:var(--line); position:relative; display:grid; place-items:center; color:var(--faint); }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s; }
.rcard:hover .thumb img { transform:scale(1.03); }
.thumb .fav { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.4); color:#fff; border-radius:50%; width:28px; height:28px; display:grid; place-items:center; }
.rcard .t { font-weight:600; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.rcard .m { font-size:.8rem; color:var(--muted); display:flex; gap:10px; }
.tile { position:relative; aspect-ratio:3/2; border-radius:12px; overflow:hidden; background:var(--line); cursor:pointer; }
.tile img { width:100%; height:100%; object-fit:cover; }
.tile .lbl { position:absolute; inset:auto 0 0 0; padding:30px 12px 10px; background:linear-gradient(transparent, rgba(0,0,0,.7)); color:#fff; }
.tile .lbl b { display:block; font-size:1.05rem; }
.tile .lbl span { font-size:.8rem; opacity:.85; }
.tile .del { position:absolute; top:6px; right:6px; display:none; }
.tile:hover .del { display:inline-flex; background:rgba(0,0,0,.45); color:#fff; }

/* recipe page */
.hero { width:100%; max-height:420px; aspect-ratio:16/8; object-fit:cover; border-radius:18px; display:block; background:var(--line); }
.rhead { margin:22px 0 10px; }
.rhead h1 { font-size:clamp(1.8rem, 3.5vw, 2.6rem); }
.meta { display:flex; flex-wrap:wrap; gap:6px 22px; margin:12px 0; }
.meta div small { display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.meta div b { font-weight:600; }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 6px; }
.controls { display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:12px 14px; background:var(--panel); border:1px solid var(--line); border-radius:12px; margin:18px 0 4px; }
.stepper { display:inline-flex; align-items:center; gap:6px; }
.stepper button { width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--bg); cursor:pointer; font-size:1.1rem; line-height:1; }
.cols { display:grid; grid-template-columns:minmax(260px, 380px) 1fr; gap:40px; align-items:start; }
@media (max-width: 960px) { .cols { grid-template-columns:1fr; gap:0; } }
.cols .left { position:sticky; top:16px; }
@media (max-width: 960px) { .cols .left { position:static; } }
ul.ings { list-style:none; margin:0; padding:0; }
ul.ings li { border-bottom:1px solid var(--line); }
ul.ings label { display:flex; gap:12px; padding:9px 2px; cursor:pointer; align-items:flex-start; }
ul.ings input { margin-top:4px; width:17px; height:17px; accent-color:var(--accent); flex:none; }
ul.ings input:checked + span { text-decoration:line-through; color:var(--faint); }
.grouphead { font-size:.75rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600; margin:18px 0 4px; }
ol.steps { list-style:none; margin:0; padding:0; counter-reset:step; }
ol.steps li { counter-increment:step; position:relative; padding:0 0 20px 46px; font-size:1.05rem; line-height:1.6; }
ol.steps li::before { content:counter(step); position:absolute; left:0; top:1px; width:30px; height:30px; border-radius:50%; background:var(--accent);
                      color:#fff; font:700 .85rem var(--sans); display:grid; place-items:center; }
.nut { display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:10px; }
.nut div { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
.nut b { display:block; font-size:1.15rem; }
.notes { background:rgba(240,200,60,.12); border-radius:12px; padding:14px 16px; white-space:pre-wrap; }
details.more { position:relative; }
details.more summary { list-style:none; } details.more summary::-webkit-details-marker { display:none; }
details.more .pop { position:absolute; z-index:30; top:calc(100% + 6px); right:0; min-width:220px; background:var(--panel); border:1px solid var(--line);
  border-radius:12px; padding:6px; box-shadow:0 12px 40px rgba(0,0,0,.15); display:flex; flex-direction:column; }
@media (max-width: 600px) { details.more .pop { right:auto; left:0; } }
details.more .pop button, details.more .pop a { text-align:left; border:0; background:transparent; padding:9px 12px; border-radius:8px; cursor:pointer; display:flex; gap:10px; align-items:center; }
details.more .pop button:hover, details.more .pop a:hover { background:var(--accent-soft); }
details.more .pop hr { border:0; border-top:1px solid var(--line); margin:4px 0; }
.banner { display:flex; gap:12px; align-items:center; flex-wrap:wrap; background:var(--accent-soft); padding:12px 16px; border-radius:12px; margin-top:14px; }

/* sub-recipe diagram */
.flow { display:flex; flex-direction:column; align-items:center; gap:10px; padding:18px; background:var(--panel); border:1px solid var(--line); border-radius:14px; }
.flow .parts { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.flow .chip { padding:7px 14px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:600; }
.flow .final { padding:9px 18px; border-radius:999px; background:var(--accent); color:#fff; font-weight:700; }
.comps { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:14px; margin-top:14px; }
.comp { border:1px solid var(--line); border-radius:14px; padding:16px; background:var(--panel); }
.comp.final { border:2px solid var(--accent); }
.comp h3 { font-size:1.1rem; margin-bottom:4px; }
.comp .into { font-size:.8rem; color:var(--muted); margin-bottom:10px; }
.comp ul, .comp ol { margin:6px 0; padding-left:20px; font-size:.93rem; }

/* modal */
.backdrop { position:fixed; inset:0; background:rgba(15,10,5,.45); z-index:50; display:grid; place-items:center; padding:16px; animation:fade .15s; }
@keyframes fade { from { opacity:0; } }
.modal { background:var(--bg); border-radius:18px; width:min(620px, 100%); max-height:90vh; overflow:auto; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
.modal h2 { margin:0 0 16px; }
.modal .foot { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
.drop { border:2px dashed var(--line); border-radius:14px; padding:28px; text-align:center; color:var(--muted); cursor:pointer; }
.drop.over { border-color:var(--accent); background:var(--accent-soft); }
.toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:12px;
         z-index:80; font-weight:500; box-shadow:0 8px 30px rgba(0,0,0,.25); animation:fade .2s; max-width:90vw; }
@media (max-width: 860px) { .toast { bottom:86px; } }

/* cook mode */
.cook { position:fixed; inset:0; background:var(--bg); z-index:60; display:flex; flex-direction:column; }
.cook header { display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:1px solid var(--line); }
.cook header h3 { flex:1; font-size:1.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cook .progress { height:4px; background:var(--line); } .cook .progress div { height:100%; background:var(--accent); transition:width .25s; }
.cook .body { flex:1; display:grid; grid-template-columns:1fr 320px; min-height:0; }
@media (max-width: 860px) { .cook .body { grid-template-columns:1fr; } .cook aside { display:none; } .cook aside.show { display:block; position:absolute; inset:60px 0 90px 0; background:var(--bg); z-index:2; } }
.cook .stage { overflow:auto; padding:clamp(20px, 6vw, 80px); display:flex; flex-direction:column; justify-content:center; }
.cook .stage .sec { font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
.cook .stage .num { color:var(--accent); font-weight:600; margin:6px 0 14px; }
.cook .stage .text { font:500 clamp(1.5rem, 3.2vw, 2.4rem)/1.35 var(--serif); }
.cook .stage .uses { margin-top:22px; color:var(--muted); }
.cook aside { border-left:1px solid var(--line); overflow:auto; padding:18px; }
.cook footer { display:flex; gap:12px; padding:14px 20px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
.cook footer .btn { flex:1; padding:14px; font-size:1.05rem; }
.timers { display:flex; gap:8px; flex-wrap:wrap; padding:10px 20px 0; }
.timer { display:inline-flex; gap:8px; align-items:center; background:var(--accent-soft); color:var(--accent); padding:6px 12px; border-radius:999px; font-weight:600; font-variant-numeric:tabular-nums; }
.timer.done { background:rgba(192,57,43,.15); color:var(--danger); animation:pulse 1s infinite; }
@keyframes pulse { 50% { opacity:.55; } }

/* shopping */
.shop .aisle { margin-bottom:22px; }
.shop .aisle h3 { font:600 .78rem var(--sans); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px; }
.shop .item { display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-bottom:6px; }
.shop .item input { width:19px; height:19px; accent-color:var(--accent); }
.shop .item .src { font-size:.78rem; color:var(--faint); }
.shop .item.done span.n { text-decoration:line-through; color:var(--faint); }

/* journal / feed */
.entry { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
.entry img { width:100%; max-height:340px; object-fit:cover; border-radius:10px; margin:10px 0; }
.stars { color:#e0a030; letter-spacing:2px; }
.starpick button { border:0; background:transparent; font-size:1.7rem; cursor:pointer; color:#e0a030; padding:0 2px; }

/* login */
.login { min-height:100vh; display:grid; place-items:center; padding:20px; }
.login .card { width:min(420px, 100%); padding:30px; }
.login h1 { font-size:2.4rem; margin-bottom:6px; }

@media print {
  nav, .actions, .controls, .no-print, .banner, .toast { display:none !important; }
  body { background:#fff; color:#000; font-size:11.5pt; }
  main { padding:0; max-width:none; }
  .hero { max-height:220px; }
  .cols { grid-template-columns:1fr; gap:0; } .cols .left { position:static; }
  ul.ings input { display:none; }
  ol.steps li::before { background:#000; }
  .card, .comp, .nut div { box-shadow:none; }
}
</style>
</head>

<div id="root"></div>

<script>

const fmtMin = (m) => { if (!m) return ""; if (m < 60) return `${m} min`; const h = Math.floor(m / 60), r = m % 60; return r ? `${h} h ${r} min` : `${h} h`; };
const timeAgo = (iso) => {
  if (!iso) return ""; const d = new Date(iso), s = (Date.now() - d) / 1000;
  if (s < 60) return "just now"; if (s < 3600) return `${Math.floor(s / 60)} min ago`; if (s < 86400) return `${Math.floor(s / 3600)} h ago`;

  plus: '<path d="M12 5v14M5 12h14"/>', heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>',
  flame: '<path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z"/>',
  speaker: '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>', back: '<path d="M15 18l-6-6 6-6"/>',

// ---------------------------------------------------------------- API
const S = { token: localStorage.getItem("mise.token"), user: null, server: null };

async function api(method, path, body, { raw = false } = {}) {
  const opts = { method, headers: {} };
  if (S.token) opts.headers.Authorization = `Bearer ${S.token}`;
  if (body instanceof FormData) opts.body = body;
  else if (body !== undefined) { opts.body = JSON.stringify(body); opts.headers["Content-Type"] = "application/json"; }
  let res;
  try { res = await fetch(path, opts); } catch (e) { throw new Error("Can't reach the server."); }
  if (res.status === 401 && S.token && !path.includes("/auth/")) { signOut(); throw new Error("Please sign in again."); }
  if (!res.ok) {
    let msg = `Server error (${res.status})`;
    try { const j = await res.json(); if (typeof j.detail === "string") msg = j.detail; else if (Array.isArray(j.detail)) msg = j.detail.map((d) => d.msg).join(", "); } catch {}
    throw new Error(msg);
  }
  return raw ? res : res.json();
}
const qs = (o) => { const p = new URLSearchParams(); for (const [k, v] of Object.entries(o)) if (v !== undefined && v !== null && v !== "") p.set(k, v); const s = p.toString(); return s ? `?${s}` : ""; };

function signOut() { S.token = null; S.user = null; localStorage.removeItem("mise.token"); location.hash = "#/"; render(); }

// ---------------------------------------------------------------- modal
function modal(html, { wide = false } = {}) {
  const bd = document.createElement("div"); bd.className = "backdrop";
  bd.innerHTML = `<div class="modal" style="${wide ? "width:min(900px,100%)" : ""}">${html}</div>`;
  const close = () => { bd.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  bd.addEventListener("mousedown", (e) => { if (e.target === bd) close(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(bd);
  $$("[data-close]", bd).forEach((b) => b.addEventListener("click", close));
  const first = $("input, textarea, select", bd); if (first) setTimeout(() => first.focus(), 30);
  return { el: bd, close };
}
function confirmBox(text, okLabel = "Delete") {
  return new Promise((resolve) => {
    const m = modal(`<h2>${esc(text)}</h2><div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ok">${esc(okLabel)}</button></div>`);
    $("#ok", m.el).onclick = () => { m.close(); resolve(true); };
    m.el.addEventListener("click", (e) => { if (e.target.hasAttribute?.("data-close")) resolve(false); });
  });
}

// ---------------------------------------------------------------- router & shell
const NAV = [["#/", "Recipes", "book"], ["#/shopping", "Shopping", "cart"], ["#/journal", "Journal", "fork"], ["#/friends", "Friends", "people"], ["#/settings", "Settings", "gear"]];

function parseHash() {
  const h = location.hash.slice(1) || "/";
  const [path, query = ""] = h.split("?");
  return { parts: path.split("/").filter(Boolean), q: Object.fromEntries(new URLSearchParams(query)) };
}

function shell() {
  const { parts } = parseHash();
  const cur = "#/" + (parts[0] && ["shopping", "journal", "friends", "settings"].includes(parts[0]) ? parts[0] : "");
  const links = (cls) => NAV.map(([h, l, i]) => `<a href="${h}" class="${h === cur ? "on" : ""}">${icon(i)}<span>${l}</span></a>`).join("");
  $("#root").innerHTML = `<div class="shell">
    <nav class="side"><a class="brand" href="#/">${LOGO}Mise</a>${links()}<div class="spacer"></div>
      <div class="who">Signed in as @${esc(S.user?.username)}</div></nav>
    <main id="main"></main>
    <nav class="tabs">${links()}</nav></div>`;
}

let renderToken = 0;
async function render() {
  const my = ++renderToken;
  if (!S.token) return renderLogin();
  if (!S.user) {
    try { [S.user, S.server] = await Promise.all([api("GET", "/api/me"), api("GET", "/api/server")]); }
    catch (e) { if (!S.token) return; $("#root").innerHTML = `<div class="login"><div class="card"><h2>Can't load Mise</h2><p class="error">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Retry</button></div></div>`; return; }
  }
  shell();
  const { parts, q } = parseHash();
  const main = $("#main");
  window.scrollTo(0, 0);
  const view = {
    "": () => viewLibrary(main, q), r: () => viewRecipe(main, parts[1], q), edit: () => viewEdit(main, parts[1]), new: () => viewEdit(main, null),
    shopping: () => viewShopping(main), journal: () => viewJournal(main), friends: () => viewFriends(main), u: () => viewProfile(main, parts[1]),
    settings: () => viewSettings(main),
  }[parts[0] || ""];
  if (my !== renderToken) return;
  (view || (() => (main.innerHTML = `<div class="empty"><h3>Not found</h3><a class="btn" href="#/">Back to recipes</a></div>`)))();
}
window.addEventListener("hashchange", render);

function openImport() {
  const m = modal(`<h2>Add a recipe</h2>
    <div class="seg" id="itabs" style="margin-bottom:16px"><button data-t="link" class="on">Link</button><button data-t="text">Text</button><button data-t="file">Photo or file</button></div>
    <div data-p="link"><label class="field"><span>Recipe or video link</span><input type="url" id="iurl" placeholder="https://…"></label>
      <p class="small muted">Recipe websites import instantly. YouTube, TikTok and Instagram are read from captions, description and speech${S.server?.ai ? "" : " (works best with AI enabled on the server)"}.</p></div>
    <div data-p="text" class="hidden"><label class="field"><span>Title (optional)</span><input type="text" id="ititle"></label>
      <label class="field"><span>Recipe text</span><textarea id="itext" rows="10" placeholder="Paste a recipe — ingredients and steps"></textarea></label></div>
    <div data-p="file" class="hidden"><div class="drop" id="drop">Drop photos, a PDF or a Word file here, or <b style="color:var(--accent)">browse</b>
      <div class="small" style="margin-top:6px">Up to 6 photos of the same recipe${S.server?.ai ? "" : " · photo imports need AI enabled on the server"}</div></div>
      <input type="file" id="ifile" multiple accept="image/*,.pdf,.doc,.docx,.txt,.md,.rtf,.html" class="hidden"><div id="flist" class="small muted" style="margin-top:8px"></div></div>
    <p class="error" id="ierr"></p>
    <div class="foot"><a class="btn ghost" href="#/new" data-close style="margin-right:auto">Write it myself</a><button class="btn" data-close>Cancel</button><button class="btn primary" id="go">Import</button></div>`);
  const el = m.el; let tab = "link"; let files = [];
  $$("#itabs button", el).forEach((b) => b.onclick = () => {
    tab = b.dataset.t; $$("#itabs button", el).forEach((x) => x.classList.toggle("on", x === b));
    $$("[data-p]", el).forEach((p) => p.classList.toggle("hidden", p.dataset.p !== tab));
  });
  const setFiles = (list) => { files = [...list]; $("#flist", el).textContent = files.map((f) => f.name).join(", "); };
  const drop = $("#drop", el);
  drop.onclick = () => $("#ifile", el).click();
  $("#ifile", el).onchange = (e) => setFiles(e.target.files);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); setFiles(e.dataTransfer.files); };
  $("#iurl", el).addEventListener("keydown", (e) => { if (e.key === "Enter") $("#go", el).click(); });
  $("#go", el).onclick = async () => {
    const go = $("#go", el), err = $("#ierr", el); err.textContent = "";
    let req;
    if (tab === "link") {
      const u = $("#iurl", el).value.trim(); if (!u) return;
      req = () => api("POST", "/api/import/url", { url: u });
    } else if (tab === "text") {
      const t = $("#itext", el).value.trim(); if (!t) return;
      req = () => api("POST", "/api/import/text", { text: t, title: $("#ititle", el).value.trim() || null, source_type: "text" });
    } else {
      if (!files.length) return;
      const images = files.filter((f) => f.type.startsWith("image/"));
      const fd = new FormData();
      if (images.length === files.length) { images.slice(0, 6).forEach((f) => fd.append("files", f)); req = () => api("POST", "/api/import/photos", fd); }
      else { fd.append("file", files.find((f) => !f.type.startsWith("image/"))); req = () => api("POST", "/api/import/document", fd); }
    }
    go.disabled = true; go.innerHTML = `<span class="spinner" style="width:16px;height:16px;border-width:2px"></span> Reading…`;
    try {
      const res = await req();
      m.close();
      if (res.duplicate) toast("Already in your recipes");
      location.hash = `#/r/${res.recipe.id}`;
    } catch (e) { err.textContent = e.message; go.disabled = false; go.textContent = "Import"; }
  };
}

const R = { id: null, servings: null, scale: null, units: null, share: null, checked: new Set(), data: null };

async function viewRecipe(main, id, q) {

  } catch (e) { main.innerHTML = `<div class="empty"><h3>Couldn't load recipe</h3><p>${esc(e.message)}</p><a class="btn" href="#/">Back</a></div>`; return; }

function diagram(r) {
  const comps = r.components; const finalC = comps.find((c) => !c.feeds_into) || comps[comps.length - 1];
  const parts = comps.filter((c) => c !== finalC);
  const ordered = [...parts, finalC];
  return `<div class="flow">${parts.length ? `<div class="parts">${parts.map((c) => `<span class="chip">${esc(c.name)}</span>`).join("")}</div><div class="faint">↓</div>` : ""}<span class="final">${esc(finalC.name)}</span></div>
    <div class="comps">${ordered.map((c) => `<div class="comp ${c === finalC ? "final" : ""}"><h3>${esc(c.name)}</h3>
      <div class="into">${c.feeds_into ? `→ goes into ${esc(c.feeds_into)}` : "Finished dish"}</div>
      ${c.ingredients.length ? `<ul>${c.ingredients.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
      ${c.steps.length ? `<ol>${c.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}</div>`).join("")}</div>`;
}

// ---------------------------------------------------------------- speech & timers
function bestVoice() {
  const voices = speechSynthesis.getVoices(); const lang = (navigator.language || "en").slice(0, 2);
  const mine = voices.filter((v) => v.lang.startsWith(lang));
  const rank = (v) => (/(premium|enhanced|natural|neural|google)/i.test(v.name) ? 2 : 0) + (v.localService ? 0 : 1);
  return mine.sort((a, b) => rank(b) - rank(a))[0] || voices[0];
}
function speak(text) {
  if (!("speechSynthesis" in window)) return toast("Your browser can't read aloud");
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); const v = bestVoice(); if (v) u.voice = v; u.rate = 0.97; speechSynthesis.speak(u);
}
function durations(text) {
  const out = []; const rx = /(\d+(?:[.,]\d+)?)\s*(?:(?:-|–|to)\s*(\d+(?:[.,]\d+)?)\s*)?(hours?|hrs?|h\b|minutes?|mins?|seconds?|secs?)/gi; let m;
  while ((m = rx.exec(text))) {
    const a = parseFloat(m[1].replace(",", ".")), b = m[2] ? parseFloat(m[2].replace(",", ".")) : a; const u = m[3].toLowerCase();
    const secs = Math.round(Math.max(a, b) * (u[0] === "h" ? 3600 : u[0] === "s" ? 1 : 60));
    if (secs > 0 && secs <= 86400 && !out.includes(secs)) out.push(secs);
  }
  return out;
}
const clock = (s) => { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? `${h}:${String(m).padStart(2, "0")}` : `${m}`) + `:${String(x).padStart(2, "0")}`; };
const nice = (s) => (s >= 3600 && s % 3600 === 0 ? `${s / 3600} h` : s >= 60 && s % 60 === 0 ? `${s / 60} min` : clock(s));
function beep() { try { const c = new (window.AudioContext || window.webkitAudioContext)(); [0, .35, .7].forEach((t) => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.2, c.currentTime + t); o.start(c.currentTime + t); o.stop(c.currentTime + t + .2); }); } catch {} }

// ---------------------------------------------------------------- cook mode
function cookMode(r) {
  const steps = r.steps.length ? r.steps : [{ text: "This recipe has no steps.", section: null }];
  let i = 0, reading = localStorage.getItem("mise.read") === "1", lock = null; const timers = [];
  const el = document.createElement("div"); el.className = "cook"; document.body.appendChild(el);
  document.body.style.overflow = "hidden";
  if ("wakeLock" in navigator) navigator.wakeLock.request("screen").then((l) => (lock = l)).catch(() => {});
  const uses = (t) => { const low = t.toLowerCase(); return r.ingredients.filter((g) => { const w = (g.name || "").toLowerCase().match(/[a-z]{4,}/g); if (!w) return false; let k = w[w.length - 1]; if (k.endsWith("s")) k = k.slice(0, -1); return low.includes(k); }).map((g) => g.display); };
  const draw = () => {
    const s = steps[i]; const u = uses(s.text);
    el.innerHTML = `<header><button class="iconbtn" id="cx" title="Close (Esc)">${icon("x")}</button><h3>${esc(r.title)}</h3>
      <button class="iconbtn" id="ci" title="Ingredients">${icon("list")}</button>
      <button class="iconbtn" id="cr" title="Read steps aloud" style="${reading ? "color:var(--accent)" : ""}">${icon("speaker")}</button></header>
      <div class="progress"><div style="width:${((i + 1) / steps.length) * 100}%"></div></div>
      <div class="timers" id="tm"></div>
      <div class="body"><div class="stage">
        ${s.section ? `<div class="sec">${esc(s.section)}</div>` : ""}
        <div class="num">Step ${i + 1} of ${steps.length}</div>
        <div class="text">${esc(s.text)}</div>
        ${u.length ? `<div class="uses">${u.map((x) => `• ${esc(x)}`).join("<br>")}</div>` : ""}
        <div class="row" style="margin-top:24px">${durations(s.text).map((sec) => `<button class="btn" data-sec="${sec}">${icon("timer")}Start ${nice(sec)} timer</button>`).join("")}</div>
      </div><aside id="side"><h3 style="margin-bottom:10px">Ingredients</h3><ul class="ings">${r.ingredients.map((g) => `<li><label><input type="checkbox"><span>${esc(g.display)}</span></label></li>`).join("")}</ul></aside></div>
      <footer><button class="btn" id="cp" ${i === 0 ? "disabled" : ""}>← Back</button><button class="btn primary" id="cn">${i < steps.length - 1 ? "Next →" : "Finish ✓"}</button></footer>`;
    $("#cx", el).onclick = close; $("#cp", el).onclick = prev; $("#cn", el).onclick = next;
    $("#ci", el).onclick = () => $("#side", el).classList.toggle("show");
    $("#cr", el).onclick = () => { reading = !reading; localStorage.setItem("mise.read", reading ? "1" : "0"); reading ? say() : speechSynthesis.cancel(); draw(); };
    $$("[data-sec]", el).forEach((b) => b.onclick = () => { startTimer(+b.dataset.sec, `Step ${i + 1}`); });
    drawTimers();
  };
  const say = () => speak(`Step ${i + 1}. ${steps[i].text}`);
  const next = () => { if (i < steps.length - 1) { i++; draw(); if (reading) say(); } else close(); };
  const prev = () => { if (i > 0) { i--; draw(); if (reading) say(); } };
  const startTimer = (sec, label) => { timers.push({ end: Date.now() + sec * 1000, label, rung: false }); if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); drawTimers(); };
  const drawTimers = () => {
    const box = $("#tm", el); if (!box) return;
    box.innerHTML = timers.map((t, n) => { const left = Math.max(0, Math.round((t.end - Date.now()) / 1000));
      return `<span class="timer ${left === 0 ? "done" : ""}">${esc(t.label)} · ${left === 0 ? "Done!" : clock(left)}<button class="iconbtn" data-rm="${n}" style="padding:0;color:inherit">${icon("x", "icon")}</button></span>`; }).join("");
    $$("[data-rm]", box).forEach((b) => b.onclick = () => { timers.splice(+b.dataset.rm, 1); drawTimers(); });
  };
  const tick = setInterval(() => {
    timers.forEach((t) => { if (!t.rung && Date.now() >= t.end) { t.rung = true; beep(); if ("Notification" in window && Notification.permission === "granted") new Notification("Timer done", { body: `${r.title} — ${t.label}` }); } });
    if (timers.length) drawTimers();
  }, 1000);
  const onKey = (e) => { if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); } else if (e.key === "ArrowLeft") prev(); else if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  const onVis = () => { if (document.visibilityState === "visible" && "wakeLock" in navigator) navigator.wakeLock.request("screen").then((l) => (lock = l)).catch(() => {}); };
  document.addEventListener("visibilitychange", onVis);
  function close() { clearInterval(tick); document.removeEventListener("keydown", onKey); document.removeEventListener("visibilitychange", onVis); speechSynthesis?.cancel(); lock?.release?.(); el.remove(); document.body.style.overflow = ""; }
  draw(); if (reading) say();
}

    const h = data.home_assistant;
    $("#hastatus").innerHTML = h?.enabled ? (h.error ? `<span class="error">Home Assistant sync problem: ${esc(h.error)}</span>`
      : `✓ Synced with Home Assistant (${esc(h.entity)}). Checking off or removing items there updates this list.`) : "";
    if (!data.aisles.length && !data.checked.length) { box.innerHTML = `<div class="empty"><h3>Your list is empty</h3>Open a recipe and choose “Add to shopping list”, or type items above.</div>`; return; }
    const row = (it) => `<div class="item ${it.checked ? "done" : ""}"><input type="checkbox" data-id="${it.id}" ${it.checked ? "checked" : ""}>
      <div class="grow"><span class="n">${esc(it.display)}</span>${it.sources.length ? `<div class="src">${esc(it.sources.join(", "))}</div>` : ""}</div>
      <button class="iconbtn" data-rm="${it.id}" title="Remove">${icon("x")}</button></div>`;
    box.innerHTML = data.aisles.map((a) => `<div class="aisle"><h3>${esc(a.aisle)}</h3>${a.items.map(row).join("")}</div>`).join("")
      + (data.checked.length ? `<div class="aisle"><h3>In the cart</h3>${data.checked.map(row).join("")}</div>` : "");
    $$("input[data-id]", box).forEach((c) => c.onchange = async () => { data = await api("PATCH", `/api/shopping/items/${c.dataset.id}`, { checked: c.checked }); await load(); });
    $$("[data-rm]", box).forEach((b) => b.onclick = async () => { await api("DELETE", `/api/shopping/items/${b.dataset.rm}`); load(); });
  };
  const load = async () => { try { data = await api("GET", "/api/shopping" + qs({ units })); draw(); } catch (e) { $("#sl").innerHTML = `<p class="error">${esc(e.message)}</p>`; } };
  const segs = () => $$("#su button").forEach((b) => b.classList.toggle("on", b.dataset.u === units));
  $$("#su button").forEach((b) => b.onclick = () => { units = b.dataset.u; localStorage.setItem("mise.shopunits", units); segs(); load(); });
  segs();
  $("#af").onsubmit = async (e) => { e.preventDefault(); const v = $("#ai").value.trim(); if (!v) return; $("#ai").value = ""; await api("POST", "/api/shopping/items", { text: v }); load(); $("#ai").focus(); };
  $("#clr").onclick = async () => { await api("POST", "/api/shopping/clear-checked"); load(); };
  $("#clrall").onclick = async () => { if (await confirmBox("Clear the whole list?", "Clear list")) { await api("DELETE", "/api/shopping"); load(); } };
  $("#copyl").onclick = async () => {
    if (!data?.aisles.length) return;
    const text = data.aisles.map((a) => `${a.aisle}\n` + a.items.map((i) => `• ${i.display}`).join("\n")).join("\n\n");
    try { await navigator.clipboard.writeText(text); toast("List copied"); } catch { prompt("Your list", text); }
  };
  load();
}

// ---------------------------------------------------------------- journal
const stars = (n) => n ? `<span class="stars">${"★".repeat(n)}${"☆".repeat(5 - n)}</span>` : "";
const entryHTML = (e, showUser) => `<div class="entry">
  <div class="row"><div class="grow">${showUser && e.user ? `<a href="#/u/${esc(e.user.username)}"><b>${esc(e.user.display_name)}</b></a> <span class="muted">cooked</span> ` : ""}
    ${e.recipe ? `<a href="#/r/${e.recipe.id}"><b>${esc(e.recipe.title)}</b></a>` : ""}</div>
    <span class="small faint">${esc(timeAgo(e.cooked_at))}</span>${!showUser ? `<button class="iconbtn" data-del="${e.id}" title="Delete">${icon("x")}</button>` : ""}</div>
  ${e.photo_url ? img(e.photo_url) : ""}${stars(e.rating)}${e.text ? `<p style="margin:6px 0 0;white-space:pre-wrap">${esc(e.text)}</p>` : ""}</div>`;

async function viewJournal(main) {
  main.innerHTML = `<div class="pagehead"><h1>Journal</h1><button class="btn primary" id="new">${icon("plus")}Log a cook</button></div><div id="jl" style="max-width:760px"><div class="spinner"></div></div>`;
  const load = async () => {
    const list = await api("GET", "/api/journal");
    $("#jl").innerHTML = list.length ? list.map((e) => entryHTML(e, false)).join("") : `<div class="empty"><h3>Nothing cooked yet</h3>Log what you cook — with a photo, a rating and notes for next time.</div>`;
    $$("[data-del]", $("#jl")).forEach((b) => b.onclick = async () => { if (await confirmBox("Delete this entry?")) { await api("DELETE", `/api/journal/${b.dataset.del}`); load(); } });
  };
  $("#new").onclick = () => logCook(null, load);
  load();
}

async function logCook(recipe, after) {
  let rating = 0;
  const list = recipe ? [] : await api("GET", "/api/recipes?sort=title");
  const m = modal(`<h2>I cooked this</h2>
    ${recipe ? `<p><b>${esc(recipe.title)}</b></p>` : `<label class="field"><span>Recipe</span><select id="lr"><option value="">None</option>${list.map((r) => `<option value="${r.id}">${esc(r.title)}</option>`).join("")}</select></label>`}
    <div class="field"><span class="small muted">How was it?</span><div class="starpick" id="sp"></div></div>
    <label class="field"><span>Notes</span><textarea id="lt" rows="4" placeholder="What you changed, what to try next time"></textarea></label>
    <label class="field"><span>Photo</span><input type="file" accept="image/*" id="lp"></label>
    <label class="check"><input type="checkbox" id="lpub" ${S.user?.is_private ? "" : "checked"}>Share with friends</label>
    <p class="error" id="lerr"></p>
    <div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="sv">Save</button></div>`);
  const drawStars = () => { $("#sp", m.el).innerHTML = [1, 2, 3, 4, 5].map((i) => `<button type="button" data-s="${i}">${i <= rating ? "★" : "☆"}</button>`).join("");
    $$("[data-s]", m.el).forEach((b) => b.onclick = () => { rating = rating === +b.dataset.s ? 0 : +b.dataset.s; drawStars(); }); };
  drawStars();
  $("#sv", m.el).onclick = async () => {
    try {
      let photo_url = null; const file = $("#lp", m.el).files[0];
      if (file) { const fd = new FormData(); fd.append("file", file); photo_url = (await api("POST", "/api/media", fd)).url; }
      const rid = recipe ? recipe.id : ($("#lr", m.el).value ? +$("#lr", m.el).value : null);
      await api("POST", "/api/journal", { recipe_id: rid, text: $("#lt", m.el).value.trim() || null, rating: rating || null, photo_url, is_public: $("#lpub", m.el).checked });
      m.close(); toast("Logged in your journal"); after?.();
    } catch (e) { $("#lerr", m.el).textContent = e.message; }
  };
}

// ---------------------------------------------------------------- friends
async function viewFriends(main) {
  main.innerHTML = `<div class="pagehead"><h1>Friends</h1></div>
    <input type="search" id="fq" placeholder="Find people on this server" style="max-width:460px;margin-bottom:22px">
    <div id="fr" style="max-width:760px"></div><div id="ff" style="max-width:760px"><div class="spinner"></div></div>`;
  const search = debounce(async (v) => {
    const box = $("#fr"); if (!v) { box.innerHTML = ""; $("#ff").classList.remove("hidden"); return; }
    $("#ff").classList.add("hidden");
    const users = await api("GET", "/api/users" + qs({ q: v }));
    box.innerHTML = users.length ? users.map((u) => `<a class="entry row" href="#/u/${esc(u.username)}"><div class="grow"><b>${esc(u.display_name)}</b> <span class="muted small">@${esc(u.username)}</span></div>${u.following ? `<span class="pill">Following</span>` : ""}</a>`).join("") : `<p class="muted">No one found.</p>`;
  }, 250);
  $("#fq").oninput = (e) => search(e.target.value.trim());
  try {
    const feed = await api("GET", "/api/feed");
    $("#ff").innerHTML = feed.items.length ? feed.items.map((it) => it.type === "cooked" && it.entry ? entryHTML(it.entry, true)
      : it.recipe ? `<div class="entry row" style="align-items:flex-start"><a href="#/r/${it.recipe.id}" class="thumb" style="width:90px;flex:none">${img(it.recipe.image_url)}</a>
          <div class="grow"><div class="small muted"><a href="#/u/${esc(it.user?.username)}"><b>${esc(it.user?.display_name)}</b></a> saved · ${esc(timeAgo(it.at))}</div><a href="#/r/${it.recipe.id}"><b>${esc(it.recipe.title)}</b></a></div></div>` : "").join("")
      : `<div class="empty"><h3>No activity yet</h3>Search for people above and follow them to see what they're cooking.</div>`;
  } catch (e) { $("#ff").innerHTML = `<p class="error">${esc(e.message)}</p>`; }
}

async function viewProfile(main, username) {
  main.innerHTML = `<div class="spinner"></div>`;
  let p; try { p = await api("GET", `/api/users/${encodeURIComponent(username)}`); } catch (e) { main.innerHTML = `<div class="empty"><h3>${esc(e.message)}</h3></div>`; return; }
  main.innerHTML = `<a class="btn ghost sm" href="#/friends" style="margin-bottom:10px">${icon("back")}Friends</a>
    <div class="pagehead"><div class="grow"><h1>${esc(p.display_name)}</h1><div class="muted">@${esc(p.username)}</div>${p.bio ? `<p>${esc(p.bio)}</p>` : ""}
      <div class="row small" style="gap:18px;margin-top:8px"><span><b>${p.recipe_count}</b> recipes</span><span><b>${p.followers}</b> followers</span><span><b>${p.following_count}</b> following</span></div></div>
      ${p.id !== S.user.id ? `<button class="btn ${p.following ? "" : "primary"}" id="fol">${p.following ? "Following" : "Follow"}</button>` : ""}</div>
    ${p.hidden ? `<p class="muted">This account is private.</p>` : ""}
    ${p.recipes.length ? `<h2>Recipes</h2><div class="grid">${p.recipes.map(recipeCard).join("")}</div>` : ""}
    ${p.journal.length ? `<h2>Recently cooked</h2><div style="max-width:760px">${p.journal.map((e) => entryHTML(e, false).replace(/<button class="iconbtn" data-del[^]*?<\/button>/, "")).join("")}</div>` : ""}`;
  $("#fol")?.addEventListener("click", async () => { await api(p.following ? "DELETE" : "POST", `/api/users/${encodeURIComponent(p.username)}/follow`); viewProfile(main, username); });
}

// ---------------------------------------------------------------- settings
async function viewSettings(main) {
  const u = S.user;
  main.innerHTML = `<div class="pagehead"><h1>Settings</h1></div>
    <div style="max-width:680px;display:grid;gap:18px">
      <form class="card" id="pf"><h2 style="margin-top:0">Profile</h2>
        <label class="field"><span>Display name</span><input type="text" name="display_name" value="${esc(u.display_name)}"></label>
        <label class="field"><span>Email</span><input type="email" name="email" value="${esc(u.email)}"></label>
        <label class="field"><span>Bio</span><textarea name="bio" rows="2" style="min-height:60px">${esc(u.bio)}</textarea></label>
        <label class="field"><span>Measurements</span><select name="units"><option value="original">As written</option><option value="metric">Metric (g, ml, °C)</option><option value="imperial">US (cups, oz, °F)</option></select></label>
        <label class="check" style="margin-bottom:6px"><input type="checkbox" name="is_private" ${u.is_private ? "checked" : ""}>Private account</label>
        <p class="small muted" style="margin:0 0 14px">Private accounts hide your profile, recipes and journal from everyone else on the server. Share links still work.</p>
        <div class="row end"><button class="btn primary">Save</button></div></form>
      <form class="card" id="pw"><h2 style="margin-top:0">Password</h2>
        <label class="field"><span>Current password</span><input type="password" name="cur" autocomplete="current-password" required></label>
        <label class="field"><span>New password</span><input type="password" name="new" autocomplete="new-password" minlength="6" required></label>
        <div class="row end"><button class="btn">Change password</button></div></form>
      <div class="card"><h2 style="margin-top:0">Your data</h2>
        <p class="small muted">A zip with every recipe as Markdown plus a JSON backup you can restore on any Mise server.</p>
        <div class="row"><button class="btn" id="exz">Download export (.zip)</button><button class="btn" id="exj">Download backup (.json)</button>
          <label class="btn" style="margin:0">Restore backup…<input type="file" id="rst" accept=".json,application/json" class="hidden"></label></div></div>
      <div class="card"><h2 style="margin-top:0">Server</h2>
        <div class="small" style="display:grid;grid-template-columns:auto 1fr;gap:6px 18px">
          <span class="muted">Version</span><span>${esc(S.server?.version)}</span>
          <span class="muted">AI features</span><span>${S.server?.ai ? "On" : "Off"}</span>
          <span class="muted">Video speech-to-text</span><span>${S.server?.transcription ? "On" : "Off"}</span>
          <span class="muted">Home Assistant</span><span>${S.server?.home_assistant ? `Connected list <button class="btn sm" id="hatest" style="margin-left:6px">Test</button> <span id="hares"></span>` : "Not set up"}</span>
          <span class="muted">Signed in as</span><span>@${esc(u.username)}${u.is_admin ? " (admin)" : ""}</span></div>
        <div class="row" style="margin-top:16px"><button class="btn danger" id="so">Sign out</button></div></div>
    </div>`;
  const pf = $("#pf"); pf.units.value = u.units || "original";
  pf.onsubmit = async (e) => { e.preventDefault();
    try { S.user = await api("PATCH", "/api/me", { display_name: pf.display_name.value.trim() || null, email: pf.email.value.trim() || null, bio: pf.bio.value.trim() || null, units: pf.units.value, is_private: pf.is_private.checked }); toast("Saved"); }
    catch (err) { toast(err.message, 4000); } };
  $("#pw").onsubmit = async (e) => { e.preventDefault(); const f = e.target;
    try { await api("POST", "/api/me/password", { current_password: f.cur.value, new_password: f.new.value }); f.reset(); toast("Password changed"); } catch (err) { toast(err.message, 4000); } };
  const download = async (path, name) => {
    try { toast("Preparing download…"); const res = await api("GET", path, undefined, { raw: true }); const blob = await res.blob();
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
    catch (err) { toast(err.message, 4000); } };
  $("#exz").onclick = () => download("/api/export.zip", "mise-export.zip");
  $("#exj").onclick = () => download("/api/export.json", "mise-export.json");
  $("#rst").onchange = async (e) => { const f = e.target.files[0]; if (!f) return; const fd = new FormData(); fd.append("file", f);
    try { const r = await api("POST", "/api/import/backup", fd); toast(`Restored ${r.imported} recipes`); } catch (err) { toast(err.message, 4000); } };
  $("#so").onclick = signOut;
  $("#hatest")?.addEventListener("click", async () => { const r = await api("POST", "/api/shopping/home-assistant/test");
    $("#hares").innerHTML = `<span class="${r.ok ? "" : "error"}">${esc(r.message)}</span>`; });
}

if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};
document.addEventListener("click", (e) => $$("details.more[open]").forEach((d) => { if (!d.contains(e.target)) d.open = false; }));
render();
</script>
</body>
</html>
