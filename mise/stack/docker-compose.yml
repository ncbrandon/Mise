# Mise — Portainer stack
#
# Deploy in Portainer: Stacks → Add stack → "Repository" (point it at your git repo,
# compose path: stack/docker-compose.yml). Portainer clones the repo and builds the API image.
# Using the Web editor instead? Replace the `build:` block below with
#   image: ghcr.io/<your-github-user>/mise-server:latest
# (the included GitHub Action publishes it) or an image you built on the host.
#
# Set the variables under "Environment variables" in Portainer (see stack.env.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mise
      POSTGRES_USER: mise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - mise_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mise -d mise"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../server
    image: mise-server:latest
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MISE_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://mise:${POSTGRES_PASSWORD}@db:5432/mise
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      PUBLIC_READER: ${PUBLIC_READER:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-}
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-}
      TRANSCRIBE_BASE_URL: ${TRANSCRIBE_BASE_URL:-}
      TRANSCRIBE_API_KEY: ${TRANSCRIBE_API_KEY:-}
      YTDLP_COOKIES_FILE: /data/cookies.txt
    volumes:
      - mise_media:/data

  # Nightly database dump, keeps the last 14 days in the mise_backups volume.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mise_backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U mise -d mise -Fc -f /backups/mise-$$(date +%Y%m%d).dump &&
        find /backups -name "mise-*.dump" -mtime +14 -delete;
        sleep 86400;
      done'

  # Optional: run a local model instead of a cloud API. Uncomment, then set
  # LLM_BASE_URL=http://ollama:11434/v1, LLM_API_KEY=ollama, LLM_MODEL=qwen2.5:7b, LLM_VISION_MODEL=llava:13b
  # and pull the models once:  docker exec -it <ollama container> ollama pull qwen2.5:7b
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   volumes:
  #     - ollama:/root/.ollama

volumes:
  mise_db:
  mise_media:
  mise_backups:
  # ollama:
