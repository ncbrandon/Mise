# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
# Then set BUNDLE_ID_PREFIX and DEVELOPMENT_TEAM below (or in Xcode → Signing & Capabilities).
name: Mise
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    BUNDLE_ID_PREFIX: com.example          # <- change to your reverse domain, e.g. com.yourname
    DEVELOPMENT_TEAM: ""                   # <- your Apple team ID (Xcode shows it under Signing)
    APP_GROUP: group.$(BUNDLE_ID_PREFIX).mise
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

targets:
  Mise:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mise
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mise
        MiseAppGroup: $(APP_GROUP)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: mise
            CFBundleURLSchemes: [mise]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Mise connects to your recipe server on your home network.
        NSMicrophoneUsageDescription: Dictate a recipe out loud and Mise will write it down.
        NSSpeechRecognitionUsageDescription: Mise turns your dictated recipe into text.
        NSCameraUsageDescription: Take photos of cookbook pages and recipe cards to import them.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
    entitlements:
      path: App/Mise.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(APP_GROUP)]
    dependencies:
      - target: MiseShare

  MiseShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mise.share
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save to Mise
        MiseAppGroup: $(APP_GROUP)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 6
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: ShareExtension/MiseShare.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(APP_GROUP)]
